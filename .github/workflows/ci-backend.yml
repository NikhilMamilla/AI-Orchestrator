name: Backend CI

on:
  push:
    branches: [develop, main]
    paths: ['Production-Core/backend/**', 'Production-Core/data/**', 'Production-Core/pytest.ini', 'Production-Core/supabase/**', '.github/workflows/ci-backend.yml']
  pull_request:
    branches: [develop, main]
    paths: ['Production-Core/backend/**', 'Production-Core/data/**', 'Production-Core/pytest.ini', 'Production-Core/supabase/**', '.github/workflows/ci-backend.yml']

defaults:
  run:
    working-directory: Production-Core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            Production-Core/backend/requirements.txt
            Production-Core/backend/requirements-server.txt
            Production-Core/backend/requirements-dev.txt
      # The suite is fully offline (SQLite store + hashing embedder + mocked LLM/HTTP), so CI needs no
      # secrets, no database and no model download. CPU-only torch keeps the install small.
      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements-dev.txt
      # errors only: syntax errors, undefined names, invalid comparisons. Style is not enforced here.
      - name: Lint (ruff, errors only)
        run: |
          pip install ruff==0.17.0
          ruff check backend --select E9,F63,F7,F82
      # the packages the server runs: an advisory against any of them fails the build
      - name: Dependency audit (server requirements)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-server.txt
      # the test-only packages (python-jose is one): reported, never a reason to fail
      - name: Dependency audit (dev-only, report)
        continue-on-error: true
        run: pip-audit -r backend/requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
