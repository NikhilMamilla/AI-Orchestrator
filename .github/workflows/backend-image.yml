name: Backend image

# Builds the backend container and publishes it to GitHub Container Registry; the Hugging Face Space runs this image.
on:
  push:
    branches: [main]
    paths: ['Production-Core/backend/**', 'Production-Core/data/**', '.github/workflows/backend-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Production-Core
          file: Production-Core/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/nikhilmamilla/kiddoo-backend:latest
            ghcr.io/nikhilmamilla/kiddoo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
