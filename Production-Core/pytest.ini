[pytest]
pythonpath = .
testpaths = backend/app/tests
asyncio_mode = auto
markers =
    postgres: needs a real Postgres with pgvector (set TEST_DATABASE_URL); skipped otherwise
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore::DeprecationWarning:pydantic.*
