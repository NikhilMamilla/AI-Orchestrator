<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf6ee" />
  <title>Kiddoo: An AI DSA tutor</title>
  <meta name="description"
    content="Kiddoo answers Data Structures & Algorithms questions only from vetted course material, cites every claim, and adapts to how you learn." />

  <!-- Apply the saved or system theme before first paint so there is no flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kiddoo-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#090d1c' : '#fbf6ee');
        if (localStorage.getItem('kiddoo-motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
        var ts = localStorage.getItem('kiddoo-text'); if (ts) document.documentElement.style.fontSize = ts + '%';
        if (localStorage.getItem('kiddoo-petals') === 'off') document.documentElement.dataset.petals = 'off';
        if (localStorage.getItem('kiddoo-contrast') === 'high') document.documentElement.dataset.contrast = 'high';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    rel="stylesheet" />
  <style>
    /* First paint of the opening sequence, before any JavaScript: identical to the intro's first frame, so the very first
       thing a visitor sees is the composed scene, never a loader. IntroExperience removes it when it takes over. */
    #intro-pre {
      position: fixed; inset: 0; z-index: 2147483000; pointer-events: none;
      background:
        radial-gradient(ellipse 85% 70% at 50% 0%, #aaebd7 0%, rgb(170 235 215 / 0) 100%),
        radial-gradient(ellipse 85% 70% at 50% 100%, rgb(170 235 215 / 0.5) 0%, rgb(170 235 215 / 0) 100%),
        #6ec8e6;
    }
    #intro-pre span {
      position: absolute; left: 5vw; bottom: 6svh; color: #173f4d;
      font: 700 clamp(7rem, 34vw, 10rem)/1 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    @media (min-width: 640px) { #intro-pre span { font-size: clamp(8rem, 28svh, 17rem); } }

    /* The loading screen for every other page: the hero's sky (per theme), the Kiddoo mark and "Loading…".
       React shows the identical screen (src/components/BootLoader.tsx) until the page is ready, so nothing flashes. */
    .boot { position: fixed; inset: 0; z-index: 2147482000; display: grid; place-items: center; background: radial-gradient(ellipse 85% 70% at 50% 0%, #aaebd7 0%, rgb(170 235 215 / 0) 100%), radial-gradient(ellipse 85% 70% at 50% 100%, rgb(170 235 215 / 0.5) 0%, rgb(170 235 215 / 0) 100%), #6ec8e6; color: #173f4d;
            font: 600 14px/1 'Space Grotesk', system-ui, sans-serif; letter-spacing: 0.04em; }
    html[data-theme='dark'] .boot { background: radial-gradient(ellipse 85% 70% at 50% 0%, rgb(46 125 119 / 0.55) 0%, rgb(46 125 119 / 0) 100%), radial-gradient(ellipse 85% 70% at 50% 100%, rgb(46 125 119 / 0.3) 0%, rgb(46 125 119 / 0) 100%), #08202a; color: #e8f1f2; }
    .boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .boot-mark { width: 44px; height: 44px; border-radius: 9999px; border: 2px solid currentColor;
                 background: linear-gradient(135deg, #f3dc8f, #c9a64a); animation: bootPulse 1.4s ease-in-out infinite; }
    .boot-dots i { display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 9999px; background: currentColor;
                   animation: bootDot 1.2s infinite ease-in-out; }
    .boot-dots i:nth-child(2) { animation-delay: 0.15s; } .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bootPulse { 50% { transform: scale(0.9); opacity: 0.8; } }
    @keyframes bootDot { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-dots i { animation: none; } }
  </style>
</head>

<body>
  <div id="intro-pre" aria-hidden="true"><span>00</span></div>
  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (location.pathname !== '/' || reduce) { var el = document.getElementById('intro-pre'); if (el) el.remove(); }
    })();
  </script>
  <div id="boot" class="boot" role="status" aria-label="Loading"><div class="boot-in"><span class="boot-mark"></span><span class="boot-dots">Loading<i></i><i></i><i></i></span></div></div>
  <script>if (location.pathname === '/') { var b = document.getElementById('boot'); if (b) b.remove(); }</script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
