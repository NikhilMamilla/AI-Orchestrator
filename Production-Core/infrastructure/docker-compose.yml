# Local stack. The database is Supabase (hosted Postgres) - there is no database container.
# Secrets come from backend/.env and frontend/.env.local (never committed); see .env.example.
# Run from Production-Core/infrastructure:  docker compose up --build
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../backend/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - hf_cache:/home/app/.cache/huggingface      # model weights downloaded once

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
    command: npm run dev -- --host

volumes:
  hf_cache:
